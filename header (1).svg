<svg width="800" height="180" viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0px); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes slideW {
        from { width: 0px; }
        to   { width: 280px; }
      }
      @keyframes blink {
        0%,100% { opacity: 1; }
        50%      { opacity: 0; }
      }
      @keyframes pulse {
        0%,100% { opacity: 1; }
        50%      { opacity: 0.2; }
      }

      .a0 { opacity:0; animation: fadeIn  0.4s 0.0s ease forwards; }
      .a1 { opacity:0; animation: fadeUp  0.6s 0.5s ease forwards; }
      .a2 { opacity:0; animation: fadeUp  0.6s 0.8s ease forwards; }
      .a3 {            animation: slideW  0.7s 1.0s ease both; }
      .a4 { opacity:0; animation: fadeIn  0.5s 1.2s ease forwards; }
      .a5 { opacity:0; animation: fadeIn  0.5s 1.5s ease forwards; }
      .cur {           animation: blink   0.9s 0.2s infinite; }
      .dot {           animation: pulse   2.0s 1.6s infinite; }
    </style>
  </defs>

  <rect width="800" height="180" fill="#0d1117" rx="10"/>

  <g class="a0">
    <text x="36" y="40" font-family="'Courier New',Courier,monospace" font-size="13" fill="#3fb950">~/swayamsankar</text>
    <text x="175" y="40" font-family="'Courier New',Courier,monospace" font-size="13" fill="#58a6ff"> $</text>
    <text x="194" y="40" font-family="'Courier New',Courier,monospace" font-size="13" fill="#8b949e"> whoami</text>
    <text class="cur" x="257" y="40" font-family="'Courier New',Courier,monospace" font-size="13" fill="#e6edf3">█</text>
  </g>

  <g class="a1">
    <text x="36" y="85" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="40" fill="#e6edf3">Swayam Sankar </text>
    <text x="446" y="85" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="40" fill="#7C3AED">Nayak</text>
  </g>

  <g class="a2">
    <text x="36" y="112" font-family="'Courier New',Courier,monospace" font-size="12" fill="#8b949e">Full-Stack Engineer · Cloud · AI · UX/UI · India</text>
  </g>

  <rect class="a3" x="36" y="120" height="2" fill="#7C3AED" rx="1"/>

  <g class="a4">
    <rect x="36"  y="132" width="80"  height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
    <text x="76"  y="147" font-family="'Courier New',Courier,monospace" font-size="10" fill="#58a6ff"  text-anchor="middle">MERN Stack</text>

    <rect x="124" y="132" width="74"  height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
    <text x="161" y="147" font-family="'Courier New',Courier,monospace" font-size="10" fill="#3fb950" text-anchor="middle">AWS Cloud</text>

    <rect x="206" y="132" width="58"  height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
    <text x="235" y="147" font-family="'Courier New',Courier,monospace" font-size="10" fill="#d2a8ff" text-anchor="middle">AI · n8n</text>

    <rect x="272" y="132" width="72"  height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
    <text x="308" y="147" font-family="'Courier New',Courier,monospace" font-size="10" fill="#ffa657" text-anchor="middle">Figma · UX</text>

    <rect x="352" y="132" width="80"  height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
    <text x="392" y="147" font-family="'Courier New',Courier,monospace" font-size="10" fill="#ff7b72" text-anchor="middle">Python · ML</text>
  </g>

  <g class="a5">
    <circle class="dot" cx="754" cy="26" r="6" fill="#1D9E75"/>
    <text x="742" y="30" font-family="'Courier New',Courier,monospace" font-size="10" fill="#8b949e" text-anchor="end">open to collaborate</text>
  </g>

</svg>
